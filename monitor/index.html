<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맥북모니터링</title>
<style>
:root{--bg:#fafaf8;--ink:#111;--mute:#6b6b66;--line:#d9d8d2;--bar:#2f6f4e;--back:#e6e5df;--bad:#b3261e;--warn:#a8650a}
@media (prefers-color-scheme:dark){:root{--bg:#101112;--ink:#ececea;--mute:#9a9a94;--line:#2c2d30;--bar:#6fcf97;--back:#26272a;--bad:#ff7a70;--warn:#e0a24a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.4}
main{max-width:56rem;margin:0 auto;padding:1.2rem 1.2rem 2rem}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem}
h1{font-size:2rem;margin:.6rem 0 .1rem;font-weight:700}
.sub{color:var(--mute);margin-bottom:1.2rem}
.warn{display:none;padding:.5rem .8rem;margin:.8rem 0;border:2px solid var(--bad);color:var(--bad);border-radius:8px}
.g{margin:1rem 0}
.g .l{display:flex;justify-content:space-between;font-size:1rem}
.g .t{height:1.4rem;background:var(--back);border-radius:.7rem;overflow:hidden;margin-top:.3rem}
.g .f{height:100%;background:var(--bar);width:0;transition:width .8s}
pre{margin:1.4rem 0 0;padding:.8rem;border:1px solid var(--line);border-radius:8px;font:.85rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:26rem;overflow:auto}
.w{color:var(--warn)}
.wd{margin:1.6rem 0 0;padding:1rem;border:1px solid var(--line);border-radius:10px}
.wd h2{font-size:1.1rem;margin:0 0 .4rem;display:flex;justify-content:space-between;font-weight:700}
.wd .row{display:flex;justify-content:space-between;align-items:center;margin:.7rem 0;font-size:1rem}
.pips{display:flex;gap:.45rem;align-items:center}
.pip{width:1rem;height:1rem;border-radius:50%;border:2px solid var(--ink);background:transparent}
.pip.on{background:var(--warn)}.pip.on.last{background:var(--bad)}
.f.hot{background:var(--warn)}.f.over{background:var(--bad)}
.bl{animation:bl 1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bl{animation:none}}
.wd pre{margin:.8rem 0 0;max-height:11rem}
.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<div class="top"><span id="at"></span><span id="state"></span></div>
<h1 id="topic">…</h1>
<div class="sub" id="sub"></div>
<div class="warn" id="warn"></div>
<div id="gauges"></div>
<section class="wd" id="wd">
<h2><span id="wdmode">감시 …</span><span id="wdage" class="sub" style="margin:0"></span></h2>
<div class="row"><span>정체 카운터 (3번째는 restart)</span><span class="pips" id="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i><b id="pipn" style="margin-left:.4rem">0 / 3</b></span></div>
<div class="g" style="margin:.4rem 0"><div class="l"><span>변화 없는 시간</span><span id="idlet">…</span></div><div class="t"><div class="f" id="idlef"></div></div></div>
<div class="row"><span>누적 변화 (쪽+줄)</span><span id="cum">…</span></div>
<div class="row"><span>오늘 restart</span><span id="rs">…</span></div>
<div class="row"><span>restart 지점 (waypoint)</span><span id="wp">…</span></div>
<pre id="wdlog"></pre>
</section>
<pre id="log"></pre>
</main>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, last = null;
  function put(s) {
    var t = s.topic || {}, j = s.job || {}, age = (Date.now() - Date.parse(s.at)) / 1000;
    if (last !== null && last !== t.title) { document.title = "맥북모니터링 · " + t.title; }
    last = t.title;
    $("topic").textContent = t.title || "…";
    $("sub").textContent = [t.stage, t.week, t.layer, j.id ? "작업 " + j.id + " · " + j.state : ""].filter(Boolean).join(" · ");
    $("at").textContent = "갱신 " + (s.at || "").replace("T", " ").replace("Z", " UTC");
    $("state").textContent = "수업표 " + (s.curriculum || "?") + " · 대기 " + (s.pending || 0);
    var w = $("warn"), msg = s.error ? "수집기 오류: " + s.error : age > 90 ? "수집기가 " + Math.round(age) + "초째 멈춰 있음" : "";
    w.style.display = msg ? "block" : "none"; w.textContent = msg;
    var g = $("gauges"); g.textContent = "";
    (s.gauges || []).forEach(function (x) {
      var d = document.createElement("div"); d.className = "g";
      var l = document.createElement("div"); l.className = "l";
      var a = document.createElement("span"); a.textContent = x.label; var b = document.createElement("span"); b.textContent = x.text + " · " + Math.round(100 * x.v) + "%";
      l.appendChild(a); l.appendChild(b);
      var t2 = document.createElement("div"); t2.className = "t"; var f = document.createElement("div"); f.className = "f"; f.style.width = Math.round(100 * x.v) + "%"; t2.appendChild(f);
      d.appendChild(l); d.appendChild(t2); g.appendChild(d);
    });
    $("log").textContent = (s.log || []).map(function (l) { return (l.t || "").slice(11, 19) + "  " + (l.src === "zyte" ? "[zyte] " : "") + l.msg; }).join("\n");
  }
  function tick() {
    fetch("status.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(put)
      .catch(function (e) { var w = $("warn"); w.style.display = "block"; w.textContent = "상태 파일을 읽지 못함: " + e.message; });
  }
  tick(); setInterval(tick, 10000);

  var MODE = { running: "작업 진행 중", off: "수업표 꺼짐 (감시 쉼)", idle_due: "다음 수업 대기", idle_none: "할 일 없음 (정상 대기)" };
  var KIND = { "continue": "continue 입력", restart: "restart", waypoint: "waypoint", note: "알림", error: "오류" };
  function putWd(w) {
    var now = Date.now(), age = (now - Date.parse(w.at)) / 1000, stall = w.stall || 0;
    $("wdmode").textContent = "감시 · " + (MODE[w.mode] || w.mode || "?");
    var a = $("wdage"); a.textContent = age > 180 ? "감시가 " + Math.round(age) + "초째 멈춰 있음" : "점검 " + Math.round(age) + "초 전"; a.className = age > 180 ? "bad" : "sub";
    var pips = $("pips").getElementsByClassName("pip");
    for (var i = 0; i < 3; i++) { pips[i].className = "pip" + (i < stall ? " on" : "") + (i === 2 && stall >= 3 ? " last" : ""); }
    $("pipn").textContent = stall + " / 3";
    var idle = (w.mode === "off" || w.mode === "idle_none") ? 0 : Math.max(0, (now - Date.parse(w.last_change)) / 60000), v = Math.min(1, idle / 30), f = $("idlef");
    f.style.width = Math.round(100 * v) + "%"; f.className = "f" + (idle >= 30 ? " over bl" : idle >= 20 ? " hot bl" : "");
    $("idlet").textContent = (w.mode === "off" || w.mode === "idle_none") ? "정상 대기" : Math.round(idle) + "분 / 30분";
    $("cum").textContent = (w.cumulative || 0).toLocaleString("ko-KR");
    $("rs").textContent = (w.restarts_today || 0) + " / 4";
    var p = w.latest_waypoint;
    $("wp").textContent = p ? [p.job, p.lesson, p.slice != null ? "구간 " + p.slice : "", (p.at || "").slice(5, 16).replace("T", " ")].filter(Boolean).join(" · ") : "아직 없음 (continue 뒤 변화가 보이면 생김)";
    $("wdlog").textContent = (w.events || []).slice(-8).reverse().map(function (e) { return (e.t || "").slice(11, 19) + "  " + (KIND[e.kind] || e.kind) + "  " + (e.msg || ""); }).join("\n") || "기록 없음";
  }
  function tickWd() {
    fetch("watchdog.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(putWd)
      .catch(function (e) { $("wdmode").textContent = "감시 · 상태 파일 없음 (" + e.message + ")"; });
  }
  tickWd(); setInterval(tickWd, 10000);
})();
</script>
</body>
</html>
